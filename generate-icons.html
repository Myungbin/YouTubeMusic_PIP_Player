<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이콘 생성기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a2e;
      color: #fff;
    }
    h1 {
      color: #f5f5f7;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .icon-item {
      text-align: center;
    }
    .icon-item canvas {
      border: 2px solid #333;
      border-radius: 8px;
    }
    .icon-item p {
      margin-top: 10px;
      color: #888;
    }
    button {
      background: linear-gradient(180deg, #3a3a3c 0%, #0a0a0b 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    .instructions {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
    }
    .instructions h3 {
      color: #f5f5f7;
      margin-bottom: 10px;
    }
    .instructions ol {
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>🎵 YouTube Music PIP - 아이콘 생성기</h1>
  
  <div class="icon-preview">
    <div class="icon-item">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
    </div>
    <div class="icon-item">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
    </div>
    <div class="icon-item">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
    </div>
  </div>

  <button onclick="downloadAll()">📥 모든 아이콘 다운로드</button>
  
  <div class="instructions">
    <h3>📋 사용 방법</h3>
    <ol>
      <li><strong>"모든 아이콘 다운로드"</strong> 버튼을 클릭하세요</li>
      <li>다운로드된 PNG 파일들을 <code>icons</code> 폴더에 넣으세요</li>
      <li>파일명이 <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code>인지 확인하세요</li>
      <li>Chrome 확장 프로그램 페이지에서 확장 프로그램을 로드하세요</li>
    </ol>
  </div>

  <script>
    // Each size has its own source: small sizes drop detail so they stay crisp.
    const SOURCES = {
      icon128: 'icons/icon.svg',
      icon48: 'icons/icon48.svg',
      icon16: 'icons/icon16.svg',
    };

    async function drawIcon(canvasId) {
      const canvas = document.getElementById(canvasId);
      const image = new Image();
      image.src = SOURCES[canvasId];
      await image.decode();

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    }

    Object.keys(SOURCES).forEach((canvasId) => {
      drawIcon(canvasId).catch(() => {
        document.querySelector('.instructions').insertAdjacentHTML(
          'afterbegin',
          '<p>SVG를 불러오지 못했습니다. 로컬 서버(예: <code>python -m http.server</code>)로 이 페이지를 열어 주세요.</p>',
        );
      });
    });

    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      setTimeout(() => downloadIcon('icon16', 'icon16.png'), 0);
      setTimeout(() => downloadIcon('icon48', 'icon48.png'), 100);
      setTimeout(() => downloadIcon('icon128', 'icon128.png'), 200);
    }
  </script>
</body>
</html>
